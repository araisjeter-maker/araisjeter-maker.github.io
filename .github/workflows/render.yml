name: Validar prévias dos vídeos

on:
  workflow_dispatch:
  push:
    paths:
      - "render_experiential_v4.py"
      - ".github/workflows/render.yml"

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar ferramentas gratuitas
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar editor gratuito
        run: |
          python -m pip install --upgrade pip
          pip install Pillow yt-dlp curl_cffi
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Criar e validar todas as cenas
        run: python render_experiential_v4.py --preview

      - name: Publicar somente as prévias
        run: |
          git config user.name "Editor Viral"
          git config user.email "actions@users.noreply.github.com"
          git add previews_v4/*.jpg
          git commit -m "Adicionar prévias para revisão visual" || exit 0
          git push

      - name: Guardar cenas para render final
        uses: actions/upload-artifact@v4
        with:
          name: previas-v4
          path: previews_v4/*.jpg
          retention-days: 7
