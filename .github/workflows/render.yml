name: Renderizar vídeos inéditos V7

on:
  workflow_dispatch:
  push:
    paths:
      - "render_viral_v7.py"
      - ".github/workflows/render.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Preparar editor gratuito
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar ferramentas gratuitas
        run: |
          python -m pip install --upgrade pip
          pip install Pillow yt-dlp curl_cffi
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Renderizar vídeos novos
        run: python render_viral_v7.py
      - name: Validar vídeos
        run: |
          for f in videos/Video_1_Misofonia_experiencia_silenciosa_v7.mp4 videos/Video_2_Discalculia_um_dia_entre_numeros_v7.mp4; do
            test -s "$f"
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$f")" = "1080"
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$f")" = "1920"
            test "$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 "$f" | wc -l)" = "0"
            duration="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f")"
            awk -v d="$duration" 'BEGIN { exit !(d >= 56 && d <= 60) }'
          done
      - name: Publicar vídeos
        run: |
          git config user.name "Editor Viral"
          git config user.email "actions@users.noreply.github.com"
          git add videos/Video_1_Misofonia_experiencia_silenciosa_v7.mp4 videos/Video_2_Discalculia_um_dia_entre_numeros_v7.mp4 previews_v7/*_contato.jpg
          git commit -m "Publicar vídeos inéditos de misofonia e discalculia" || exit 0
          git push
      - name: Criar cópia para download
        uses: actions/upload-artifact@v4
        with:
          name: videos-ineditos-v7
          path: |
            videos/Video_1_Misofonia_experiencia_silenciosa_v7.mp4
            videos/Video_2_Discalculia_um_dia_entre_numeros_v7.mp4
          retention-days: 7
