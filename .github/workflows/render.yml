name: Validar cenas virais V5 sem rostos

on:
  workflow_dispatch:
  push:
    paths:
      - "render_viral_v5.py"
      - ".github/workflows/render.yml"

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar ferramentas gratuitas
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar editor gratuito
        run: |
          python -m pip install --upgrade pip
          pip install Pillow yt-dlp curl_cffi
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Gerar e revisar todas as cenas
        run: python render_viral_v5.py --preview

      - name: Publicar folhas de revisão
        run: |
          git config user.name "Editor Viral"
          git config user.email "actions@users.noreply.github.com"
          git add previews_v5/*.jpg
          git commit -m "Adicionar revisão visual dos vídeos V5" || exit 0
          git push

      - name: Guardar prévias
        uses: actions/upload-artifact@v4
        with:
          name: revisao-v5
          path: previews_v5/*.jpg
          retention-days: 7
