name: Renderizar vídeos profissionais

on:
  workflow_dispatch:
  push:
    paths:
      - "render_native_v3.py"
      - ".github/workflows/render.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar editor gratuito
        run: |
          python -m pip install --upgrade pip
          pip install Pillow yt-dlp curl_cffi
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          ffmpeg -version
          yt-dlp --version

      - name: Renderizar versões inéditas
        run: python render_native_v3.py

      - name: Validar resolução, duração e silêncio
        run: |
          test -s videos/Video_1_Tourette_documental_v3.mp4
          test -s videos/Video_2_TDL_conversa_v3.mp4
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 videos/Video_1_Tourette_documental_v3.mp4)" = "1080"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 videos/Video_1_Tourette_documental_v3.mp4)" = "1920"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 videos/Video_2_TDL_conversa_v3.mp4)" = "1080"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 videos/Video_2_TDL_conversa_v3.mp4)" = "1920"
          test -z "$(ffprobe -v error -select_streams a -show_entries stream=codec_type -of csv=p=0 videos/Video_1_Tourette_documental_v3.mp4)"
          test -z "$(ffprobe -v error -select_streams a -show_entries stream=codec_type -of csv=p=0 videos/Video_2_TDL_conversa_v3.mp4)"
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 videos/Video_1_Tourette_documental_v3.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 videos/Video_2_TDL_conversa_v3.mp4

      - name: Publicar vídeos
        run: |
          git config user.name "Editor Viral"
          git config user.email "actions@users.noreply.github.com"
          git add videos/Video_1_Tourette_documental_v3.mp4 videos/Video_2_TDL_conversa_v3.mp4
          git commit -m "Publicar vídeos inéditos mais longos" || exit 0
          git push

      - name: Disponibilizar download
        uses: actions/upload-artifact@v4
        with:
          name: videos-profissionais-v3
          path: |
            videos/Video_1_Tourette_documental_v3.mp4
            videos/Video_2_TDL_conversa_v3.mp4
          retention-days: 30
